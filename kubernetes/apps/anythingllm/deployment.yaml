apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
  namespace: anythingllm
spec:
  replicas: 0                             # scale-to-zero by default — flip to 1 in Git when you want it running
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anythingllm
  template:
    metadata:
      labels:
        app: anythingllm
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: anythingllm
          image: mintplexlabs/anythingllm:1.15.0    # verify a pinned tag before flipping to replicas:1
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]          # required by AnythingLLM's docs (Docker cap_add)
          ports:
            - containerPort: 3001
          env:
            - name: STORAGE_DIR
              value: "/app/server/storage"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anythingllm-secrets
                  key: JWT_SECRET
            - name: LLM_PROVIDER
              value: "ollama"
            - name: OLLAMA_BASE_PATH
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: OLLAMA_MODEL_PREF
              value: "llama3.2:3b"
            - name: OLLAMA_MODEL_TOKEN_LIMIT
              value: "4096"
            - name: EMBEDDING_ENGINE
              value: "ollama"
            - name: EMBEDDING_BASE_PATH
              value: "http://ollama.ollama.svc.cluster.local:11434"
            - name: EMBEDDING_MODEL_PREF
              value: "nomic-embed-text:latest"
            - name: VECTOR_DB
              value: "lancedb"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /app/server/storage
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anythingllm-data
