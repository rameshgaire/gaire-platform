# Loki + Promtail only — Grafana comes from kube-prometheus-stack instead.
# NOTE: planned migration to Cloudflare R2 for Loki's object storage backend
# (10GB free tier) — see README "Monitoring" for the tracked follow-up.
grafana:
  enabled: false

loki:
  persistence:
    enabled: true
    storageClassName: longhorn-single-replica
    size: 5Gi
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits:   { memory: 512Mi, cpu: 300m }
  config:
    limits_config:
      retention_period: 72h

promtail:
  resources:
    requests: { memory: 64Mi, cpu: 50m }
    limits:   { memory: 128Mi, cpu: 100m }
