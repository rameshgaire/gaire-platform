# Loki + Promtail only — Grafana comes from kube-prometheus-stack instead.
# NOTE: planned migration to Cloudflare R2 for Loki's object storage backend
# (10GB free tier) — see README "Monitoring" for the tracked follow-up.
grafana:
  enabled: false

loki:
  # Chart default is `loki.isDefault: true` (confirmed via templates/datasources.yaml:27),
  # which collides with kube-prometheus-stack's Prometheus datasource (also isDefault:
  # true) — Grafana allows only one default per org and crash-loops on provisioning
  # otherwise. Prometheus stays the default; Loki must be explicit false.
  isDefault: false
  persistence:
    enabled: true
    storageClassName: longhorn-single-replica
    size: 5Gi
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits:   { memory: 512Mi, cpu: 300m }
  config:
    limits_config:
      retention_period: 72h

promtail:
  resources:
    requests: { memory: 64Mi, cpu: 50m }
    limits:   { memory: 128Mi, cpu: 100m }
