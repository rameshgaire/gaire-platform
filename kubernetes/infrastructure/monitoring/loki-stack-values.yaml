# Loki + Promtail only — Grafana comes from kube-prometheus-stack instead.
grafana:
  enabled: false

loki:
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits:   { memory: 512Mi, cpu: 300m }
  config:
    limits_config:
      retention_period: 72h          # 3 days, matches Prometheus retention

promtail:
  resources:
    requests: { memory: 64Mi, cpu: 50m }
    limits:   { memory: 128Mi, cpu: 100m }
