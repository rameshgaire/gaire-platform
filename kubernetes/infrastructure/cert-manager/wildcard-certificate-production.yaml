apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-gairelab-uk-production
  namespace: traefik
spec:
  secretName: wildcard-gairelab-uk-production-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "gairelab.uk"
    - "*.gairelab.uk"
