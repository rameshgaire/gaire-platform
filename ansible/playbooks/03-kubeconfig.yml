---
# Fetches the K3s kubeconfig from the master to this control node so a local
# kubectl (via the SSH tunnel) can reach the cluster.
# Re-run after every rebuild — K3s generates fresh certs on each install, so
# the previous ~/.kube/config becomes stale.
- name: Install kubeconfig on the control node
  hosts: master
  become: true
  gather_facts: false

  tasks:
    - name: Read the kubeconfig from the master
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig

    - name: Ensure ~/.kube exists on the control node
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write kubeconfig locally (server stays 127.0.0.1:6443 for the tunnel)
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode }}"
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: "0600"
      delegate_to: localhost
      become: false
