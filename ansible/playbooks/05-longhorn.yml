---
# Installs Longhorn via Helm and makes it the sole default StorageClass.
# Runs ON the master (uses K3s's built-in kubeconfig + local API), so it needs
# no SSH tunnel and no control-node kubeconfig — only that the cluster exists.
# Idempotent: re-running upgrades-in-place and re-patches (both safe).
- name: Install and configure Longhorn
  hosts: master
  become: true
  gather_facts: true

  vars:
    longhorn_version: "1.12.0"
    longhorn_namespace: longhorn-system
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values_remote_path: /tmp/longhorn-values.yaml

  tasks:
    - name: Install Helm on the master (if not present)
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Copy Longhorn values file to the master
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/infrastructure/longhorn/values.yaml"
        dest: "{{ values_remote_path }}"
        mode: "0644"

    - name: Add the Longhorn Helm repo
      kubernetes.core.helm_repository:
        name: longhorn
        repo_url: https://charts.longhorn.io

    - name: Install/upgrade Longhorn
      kubernetes.core.helm:
        name: longhorn
        chart_ref: longhorn/longhorn
        chart_version: "{{ longhorn_version }}"
        release_namespace: "{{ longhorn_namespace }}"
        create_namespace: true
        values_files:
          - "{{ values_remote_path }}"
        wait: true
        wait_timeout: 10m
        kubeconfig: "{{ kubeconfig }}"

    - name: Demote K3s's local-path so Longhorn is the sole default StorageClass
      ansible.builtin.command: >-
        k3s kubectl patch storageclass local-path
        -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
      register: patch_result
      changed_when: "'patched' in patch_result.stdout"
      failed_when:
        - patch_result.rc != 0
        - "'not patched' not in patch_result.stdout"
