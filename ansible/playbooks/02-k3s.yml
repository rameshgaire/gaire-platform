---
# ============================================================
# Play 1 — K3s server (control plane) on the master
# ============================================================
- name: Install K3s server on master
  hosts: master
  become: true
  gather_facts: true

  tasks:
    - name: Install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_EXEC="server \
            --node-ip {{ k3s_server_private_ip }} \
            --advertise-address {{ k3s_server_private_ip }} \
            --tls-san {{ k3s_server_private_ip }} \
            --write-kubeconfig-mode 644 \
            --disable traefik \
            --disable servicelb" \
          sh -
      args:
        creates: /usr/local/bin/k3s        # idempotency: skip if already installed

    - name: Ensure k3s server is started and enabled
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Wait for the node-token to be generated
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Read the K3s join token from the server
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token

    - name: Stash token and server URL as facts for the workers
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_node_token.content | b64decode | trim }}"
        k3s_url: "https://{{ k3s_server_private_ip }}:6443"

    - name: Wait for the Kubernetes API to respond
      ansible.builtin.wait_for:
        host: "{{ k3s_server_private_ip }}"
        port: 6443
        timeout: 120

# ============================================================
# Play 2 — K3s agents (workers), joined to the server
# ============================================================
- name: Install K3s agents on workers
  hosts: workers
  become: true
  gather_facts: true

  tasks:
    - name: Install K3s agent and join the cluster
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL="{{ hostvars['k3s-master'].k3s_url }}" \
          K3S_TOKEN="{{ hostvars['k3s-master'].k3s_token }}" \
          INSTALL_K3S_EXEC="agent \
            --node-ip {{ hostvars[inventory_hostname].ansible_host }}" \
          sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure k3s-agent is started and enabled
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: true
