---
- name: Base OS preparation for all K3s nodes
  hosts: k3s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - vim
          - htop
          - net-tools
          - chrony          # time sync — etcd/K3s are sensitive to clock drift
          - open-iscsi       # required by Longhorn later; harmless to install now
          - nfs-common
        state: present

    - name: Ensure chrony (time sync) is running
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap permanently in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Load kernel modules needed for container networking
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Set sysctl params for Kubernetes networking
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: net.ipv4.ip_forward, value: "1" }

    - name: Reboot if kernel was upgraded
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: false   # set to: ansible_facts.packages is changed  — left off by default
