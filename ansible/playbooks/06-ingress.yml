---
# Ingress layer: Traefik (play 1), cert-manager (play 2), cert-manager config (play 3).
# All run ON the master (K3s kubeconfig + local API) — no SSH tunnel needed.

- name: Install Traefik ingress controller
  hosts: master
  become: true
  gather_facts: false

  vars:
    traefik_version: "40.2.0"
    traefik_namespace: traefik
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values_remote_path: /tmp/traefik-values.yaml

  tasks:
    - name: Add the Traefik Helm repo
      kubernetes.core.helm_repository:
        name: traefik
        repo_url: https://traefik.github.io/charts

    - name: Copy Traefik values to the master
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/infrastructure/traefik/values.yaml"
        dest: "{{ values_remote_path }}"
        mode: "0644"

    - name: Install/upgrade Traefik
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        chart_version: "{{ traefik_version }}"
        release_namespace: "{{ traefik_namespace }}"
        create_namespace: true
        values_files:
          - "{{ values_remote_path }}"
        kubeconfig: "{{ kubeconfig }}"

- name: Install cert-manager
  hosts: master
  become: true
  gather_facts: false

  vars:
    certmanager_version: "v1.18.2"
    certmanager_namespace: cert-manager
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Add the Jetstack (cert-manager) Helm repo
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

    - name: Install/upgrade cert-manager (with CRDs)
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ certmanager_version }}"
        release_namespace: "{{ certmanager_namespace }}"
        create_namespace: true
        wait: true
        wait_timeout: 10m
        atomic: true
        kubeconfig: "{{ kubeconfig }}"
        values:
          crds:
            enabled: true

- name: Configure cert-manager (Cloudflare secret + Let's Encrypt staging issuer)
  hosts: master
  become: true
  gather_facts: false

  vars_files:
    - ../../secrets/ansible-secrets.yml

  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Render the Cloudflare API token Secret on the master
      ansible.builtin.copy:
        dest: /tmp/cloudflare-secret.yaml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: cloudflare-api-token
            namespace: cert-manager
          type: Opaque
          stringData:
            api-token: "{{ cloudflare_api_token }}"
      no_log: true

    - name: Apply the Cloudflare API token Secret
      ansible.builtin.command:
        cmd: k3s kubectl apply -f /tmp/cloudflare-secret.yaml
      register: cf_secret
      changed_when: "'created' in cf_secret.stdout or 'configured' in cf_secret.stdout"

    - name: Remove the rendered Secret file from the master
      ansible.builtin.file:
        path: /tmp/cloudflare-secret.yaml
        state: absent

    - name: Copy the staging ClusterIssuer to the master
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/infrastructure/cert-manager/cluster-issuer-staging.yaml"
        dest: /tmp/cluster-issuer-staging.yaml
        mode: "0644"

    - name: Apply the staging ClusterIssuer
      ansible.builtin.command:
        cmd: k3s kubectl apply -f /tmp/cluster-issuer-staging.yaml
      register: issuer
      changed_when: "'created' in issuer.stdout or 'configured' in issuer.stdout"

    - name: Wait for staging ClusterIssuer to become Ready
      ansible.builtin.command:
        cmd: >
          k3s kubectl wait
          clusterissuer/letsencrypt-staging
          --for=condition=Ready
          --timeout=180s

    -  name: Copy the production ClusterIssuer to the master
       ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/infrastructure/cert-manager/cluster-issuer-production.yaml"
        dest: /tmp/cluster-issuer-production.yaml
        mode: "0644"

    - name: Apply the production ClusterIssuer
      ansible.builtin.command:
        cmd: k3s kubectl apply -f /tmp/cluster-issuer-production.yaml
      register: prod_issuer
      changed_when: "'created' in prod_issuer.stdout or 'configured' in prod_issuer.stdout"

    - name: Wait for production ClusterIssuer to become Ready
      ansible.builtin.command:
        cmd: >
          k3s kubectl wait
          clusterissuer/letsencrypt-production
          --for=condition=Ready
          --timeout=180s
